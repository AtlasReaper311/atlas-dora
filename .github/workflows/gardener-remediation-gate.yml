name: Gardener remediation gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gardener-remediation-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gardener:
    uses: AtlasReaper311/atlas-gardener/.github/workflows/gardener-automerge-gate.yml@cb63f8198bc0184711f8112f213d855efa41162e
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    with:
      enabled: ${{ vars.ATLAS_GARDENER_AUTOMERGE_ENABLED == 'true' }}
      expected_app_login: atlas-gardener-w37-atlasreaper[bot]
      required_checks_json: '["check"]'
      authority_ref: 6689de2c7ccd9264348c75bed99745021f88f191
