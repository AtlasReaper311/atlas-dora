name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Generate binding types
        run: npx wrangler types --include-runtime false
      - name: Check generated binding types
        run: git diff --exit-code --ignore-matching-lines='^// Generated by Wrangler' -- worker-configuration.d.ts
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Check out pinned Atlas Infra Worker contract validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
        with:
          repository: AtlasReaper311/atlas-infra
          ref: f971172dc258c93dffa53b8b7a3532c5be55883d
          path: .atlas-infra-contracts
          persist-credentials: false
      - name: Validate bundled Worker metadata contract
        run: |
          python3 .atlas-infra-contracts/scripts/worker_contract.py check \
            --bundle-dir dist \
            --require-meta
