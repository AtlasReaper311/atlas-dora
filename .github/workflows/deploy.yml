name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: AtlasReaper311/atlas-infra/.github/workflows/deploy-worker.yml@d38ff1ce24b3c9da1e18fabaf52196f1d7cc9b79 # atlas-infra public-private boundary
    with:
      worker_name: atlas-dora
      run_lint: true
      run_tests: true
    secrets: inherit
